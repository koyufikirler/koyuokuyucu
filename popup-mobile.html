<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Dark Mode - Mobile Test</title>
    <style>
        body {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #2c2c2e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            flex-direction: column;
        }

        .header {
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #2c2c2e;
            width: 100%;
            padding: 5px 0;
        }

        select,
        button {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #48484a;
            background: #1c1c1e;
            color: #fff;
        }

        button {
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #3a3a3c;
        }

        .device {
            width: 375px;
            height: 812px;
            border: 12px solid #000;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            background: #fff;
            transition: all 0.3s ease;
        }

        /* Çentik (Notch) Stili */
        .device.with-notch::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background-color: #000;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 100;
            pointer-events: none;
        }

        .device iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .info {
            margin-top: 20px;
            font-size: 14px;
            color: #8e8e93;
        }
    </style>
</head>

<body>
    <div class="header">
        <label for="deviceSelect">Cihaz Seç:</label>
        <select id="deviceSelect" onchange="updateDevice()">
            <optgroup label="iPhones">
                <option value="320x568" data-has-notch="false">iPhone SE (320x568)</option>
                <option value="375x812" data-has-notch="true">iPhone X/11/13 Mini (375x812)</option>
                <option value="390x844" data-has-notch="true">iPhone 12/13/14 (390x844)</option>
                <option value="393x852" data-has-notch="true">iPhone 14/15 Pro (393x852)</option>
                <option value="430x932" data-has-notch="true">iPhone 15 Pro Max/16 Pro (430x932)</option>
                <option value="428x926" data-has-notch="true">iPhone Plus/Max (428x926)</option>
            </optgroup>
            <optgroup label="Android">
                <option value="360x780" data-has-notch="false">Samsung S23/S24 (360x780)</option>
                <option value="412x915" data-has-notch="false">Android Large (412x915)</option>
                <option value="412x920" data-has-notch="false">Samsung S24 Ultra (412x920)</option>
                <option value="448x1000" data-has-notch="false">Pixel 8/9 Pro (448x1000)</option>
            </optgroup>
            <optgroup label="Foldables & Tablets">
                <option value="300x700" data-has-notch="false">Foldable Outer (300x700)</option>
                <option value="768x1024" data-has-notch="false">iPad Mini (768x1024)</option>
                <option value="820x1180" data-has-notch="false">iPad Air/Pro (820x1180)</option>
            </optgroup>
            <optgroup label="Other">
                <option value="600x600" data-has-notch="false">Extension Max Width (600x600)</option>
            </optgroup>
        </select>
        <button onclick="rotateDevice()">🔄 Döndür</button>
    </div>

    <div class="device" id="deviceFrame" style="width: 320x; height: 568px; border-width: 12px; border-radius: 40px;">
        <iframe src="popup.html"></iframe>
    </div>

    <script>
        // Cihazın mevcut çentik durumunu takip etmek için
        // Cihazın orijinal çentik bilgisini tutan değişken
        // Global değişkenlerle mevcut boyutları takip edelim
        let currentW = 320;
        let currentH = 568;
        let currentHasNotch = false;

        function updateDevice() {
            const select = document.getElementById('deviceSelect');
            const selectedOption = select.options[select.selectedIndex];

            const dims = selectedOption.value.split('x');
            // Global değerleri güncelliyoruz
            currentW = parseInt(dims[0]);
            currentH = parseInt(dims[1]);
            currentHasNotch = selectedOption.getAttribute('data-has-notch') === 'true';

            applyDimensions(currentW, currentH, currentHasNotch);
        }

        function rotateDevice() {
            // Mevcut global genişlik ve yüksekliği takas et (Swap)
            const temp = currentW;
            currentW = currentH;
            currentH = temp;

            applyDimensions(currentW, currentH, currentHasNotch);
        }

        function applyDimensions(width, height, hasNotch) {
            const device = document.getElementById('deviceFrame');

            // Stil değerlerini ata
            device.style.width = width + 'px';
            device.style.height = height + 'px';

            const isLandscape = width > height;

            // Çentik Yönetimi
            if (hasNotch && !isLandscape) {
                device.classList.add('with-notch');
            } else {
                device.classList.remove('with-notch');
            }

            // Çerçeve Kalınlığı Ayarı
            // Not: width veya height'tan herhangi biri 768+ ise tablet modu gibi davranabilir
            if (width >= 768 && height >= 600) {
                device.style.borderWidth = '8px';
                device.style.borderRadius = '20px';
            } else {
                device.style.borderWidth = '12px';
                device.style.borderRadius = '40px';
            }
        }

        window.onload = updateDevice;
    </script>
</body>

</html>
