name: Create Extension Release

on:
  push:
    tags:
      - "s*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create ZIP
        run: |
          mkdir release

          zip -r "release/extension-${{ steps.version.outputs.VERSION }}.zip" \
            _locales \
            icons \
            content.js \
            manifest.json
            popup.html \
            popup.js \

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/extension-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true